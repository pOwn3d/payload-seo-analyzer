name: CI

on:
  push:
    branches: [main]
    # Without this the publish job below, gated on refs/tags/v*, never fires:
    # pushing v2.0.0 triggered nothing at all.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches package.json engines: ^20.19.0 || >=22.12.0 (Node 18 is EOL).
        # Node 22 minimum: pnpm 11 (pinned via packageManager) requires the
        # node:sqlite builtin, which does not exist before Node 22. This is a
        # constraint of the toolchain, not of the published package — see engines.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` here on purpose — action-setup reads `packageManager`
      # from package.json, so CI runs the exact pnpm that produced
      # pnpm-lock.yaml. Pinning 9 while the lockfile is written by 11 is how a
      # `--frozen-lockfile` job drifts from the local tree.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` here on purpose — action-setup reads `packageManager`
      # from package.json, so CI runs the exact pnpm that produced
      # pnpm-lock.yaml. Pinning 9 while the lockfile is written by 11 is how a
      # `--frozen-lockfile` job drifts from the local tree.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The publish job re-runs the full chain rather than trusting `needs:
      # build`. `needs` only guarantees the other job succeeded on the same
      # commit, and this job is what actually pushes to the registry — an npm
      # version can never be rewritten, so nothing here should be taken on faith.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
