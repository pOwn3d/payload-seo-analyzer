# pnpm 11 requires package build scripts to be opted into explicitly. These
# entries were left on their scaffolded placeholder value ("set this to true or
# false"), which makes `pnpm install --frozen-lockfile` exit 1 with
# ERR_PNPM_IGNORED_BUILDS — the CI then fails on its very first step.
# Note: the key is `allowBuilds`; `onlyBuiltDependencies` is the pnpm 10 spelling
# and is silently ineffective here (verified: exit 1 with it, exit 0 with this).

packages:
  - '.'

allowBuilds:
  # tsup and vitest both run esbuild; its postinstall links the platform binary.
  esbuild: true
  # Transitive optional of payload (image processing). Never invoked by this
  # package's build or tests, and it ships prebuilt binaries anyway.
  sharp: false

# Advisories carried by the build toolchain, not by anything this package ships.
# `sass` is pinned by Payload and Next, and it drags an `immutable` and a
# `picomatch` that GitHub flags high; `vite` arrives through vitest. None of the
# three reaches a consumer — `dependencies` is empty, so the published tarball
# has no runtime dependency at all — but a security workflow that is red every
# single run is a gate nobody reads. Forcing the patched patch-level here fixes
# the finding instead of muting it. Review when Payload moves off sass 1.77.
overrides:
  immutable: '>=4.3.9'
  picomatch: '>=2.3.2'
  vite: '>=6.4.3'
  postcss: '>=8.5.18'
  undici: '>=7.29.0'
  nanoid: '>=3.3.18'
  fast-uri: '>=3.1.6'
  sharp: '>=0.35.0'
